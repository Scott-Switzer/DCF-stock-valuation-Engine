[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "workers-py>=1.17.7",
]

[project]
name = "dcf-valuation-engine"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["flask==3.1.3", "requests==2.34.2", "workers-runtime-sdk==1.9.3"]
