name: Validate valuation engine
on:
  push:
    branches: [main, codex/cuig-dcf-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Build the shipped Worker bundle before testing
        run: python scripts/embed_assets.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        if: matrix.python == '3.12'
        with:
          node-version: '22'
      - name: Check private cloud data adapters and queue gates
        if: matrix.python == '3.12'
        run: |
          npm ci --prefix deploy/security-funnel
          node deploy/security-funnel/test/reader.test.mjs
          node deploy/security-funnel/test/history.test.mjs
          node deploy/security-funnel/test/valuation.test.mjs
          node deploy/security-funnel/test/enrichment.test.mjs
          node deploy/security-funnel/test/queries.test.mjs
          node --test deploy/security-funnel/test/snapshot.test.mjs deploy/security-funnel/test/session-query.test.mjs deploy/security-funnel/test/catalog-query.test.mjs deploy/security-funnel/test/structured-query.test.mjs deploy/security-funnel/test/period-query.test.mjs deploy/security-funnel/test/total-return.test.mjs
      - name: Syntax-check every shipped script
        run: |
          for f in static/js/*.js; do
            node --check "$f"
          done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci --prefix tests/browser
      - name: Type-check isolated experimental TypeScript module (not production parity)
        run: npm --prefix tests/browser run typecheck
      - name: Install headless Chromium
        run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Deterministic editor, preview, save/reload and independent workbook acceptance
        run: npm --prefix tests/browser test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: tests/browser/artifacts/
