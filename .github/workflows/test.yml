name: Validate valuation engine
on:
  push:
    branches: [main, codex/cuig-dcf-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Syntax-check every shipped script
        run: |
          for f in static/js/*.js; do
            node --check "$f"
          done
